<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KenEyeCue Advisor｜第一印象訊號顧問</title>
  <meta name="description" content="看你臉上正在發生的事。眉頭、眉峰、眉尾、眉眼距。不宣布命運，只拆解誤讀。" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="#home">KenEyeCue</a>
    <div class="nav-links">
      <a href="#home">首頁</a>
      <a href="#scan">開始初掃</a>
      <a href="#shop">方案</a>
      <a href="#account">帳戶</a>
    </div>
    <button class="btn btn-primary" onclick="location.hash='scan'">進入顧問室</button>
  </nav>
  <section class="page active" id="page-home">
    <div class="hero">
      <div>
        <div class="kicker">Advisor 01 · Signal not fate</div>
        <h1>別人誤讀你，<br>通常從眉眼開始。</h1>
        <p class="lede">KenEyeCue 顧問只看四個可觀察位置：眉頭、眉峰、眉尾、眉眼距。不談改命，不定義你是誰。先指出訊號，再告訴你別人可能怎麼讀錯。</p>
        <div class="cta-row">
          <button class="btn btn-primary" onclick="location.hash='scan'">免費初掃</button>
          <button class="btn btn-ghost" onclick="location.hash='shop'">看完整對照</button>
        </div>
      </div>
      <div class="advisor-card">
        <img src="assets/advisor.jpg" alt="KenEyeCue 顧問" />
        <div class="advisor-caption"><small>ADVISOR</small>先看訊號，不先聽故事</div>
      </div>
    </div>
  </section>
  <section class="page" id="page-scan">
    <h1>上傳正面照</h1>
    <form class="form" onsubmit="startScan(event)" style="max-width:560px;margin-top:24px">
      <input id="photo" type="file" accept="image/*" required />
      <select id="context"><option>公開場合</option><option>面試提案</option><option>管理場合</option><option>社交感情</option></select>
      <select id="star"><option value="">主星未知</option><option>紫微</option><option>天機</option><option>太陽</option><option>武曲</option><option>天同</option><option>廉貞</option><option>天府</option><option>太陰</option><option>貪狼</option><option>巨門</option><option>天相</option><option>七殺</option><option>破軍</option><option>天梁</option><option>文昌</option></select>
      <button class="btn btn-primary" type="submit">進入顧問室</button>
    </form>
  </section>
  <section class="page" id="page-session">
    <div class="session">
      <div class="stage"><img class="advisor" src="assets/advisor.jpg" alt="顧問" /></div>
      <div>
        <div class="meta" id="layerTag">免費初掃</div>
        <div class="dialog" id="dialog">先把臉轉正。</div>
        <div class="photo-wrap" style="margin-top:16px">
          <img class="user" id="userPhoto" alt="你的照片" />
          <div class="hotspots">
            <button class="spot" data-id="B1" onclick="pickSpot('B1', true)"></button>
            <button class="spot" data-id="B2" onclick="pickSpot('B2', true)"></button>
            <button class="spot" data-id="B3" onclick="pickSpot('B3', true)"></button>
            <button class="spot" data-id="B4" onclick="pickSpot('B4', true)"></button>
          </div>
        </div>
        <div id="paywall" style="margin-top:16px"><button class="btn btn-bronze" onclick="location.hash='shop'">解鎖下一層 NT$2,280</button></div>
        <div id="fullTools" style="display:none;margin-top:16px"><button class="btn btn-ghost" onclick="speak('校準先從噪音最大的位置開始。','這不是改命。')">聽校準方向</button></div>
      </div>
    </div>
  </section>
  <section class="page" id="page-shop">
    <h1>方案</h1>
    <div class="products">
      <article class="product"><h3>初掃</h3><div class="price">NT$0</div><button class="btn btn-ghost" onclick="location.hash='scan'">開始</button></article>
      <article class="product"><h3>完整對照</h3><div class="price">NT$2,280</div><button class="btn btn-primary" onclick="addCart('full')">加入購物車</button></article>
      <article class="product"><h3>顧問月卡</h3><div class="price">NT$880</div><button class="btn btn-bronze" onclick="addCart('member')">訂閱月卡</button></article>
    </div>
    <button class="btn btn-ghost" style="margin-top:16px" onclick="addCart('studio')">加購一對一 NT$3,500</button>
  </section>
  <section class="page" id="page-checkout">
    <h1>結帳</h1>
    <div id="cartLines" class="form"></div>
    <p>合計 <strong id="sum">NT$0</strong></p>
    <form class="form" onsubmit="pay(event)">
      <input id="email" type="email" required placeholder="Email" />
      <button class="btn btn-primary" type="submit">確認付款並解鎖</button>
    </form>
    <div class="ok-box" id="paidBox" style="display:none">已解鎖。<button class="btn btn-primary" onclick="location.hash='session'">回顧問室</button></div>
  </section>
  <section class="page" id="page-account">
    <h1>帳戶</h1>
    <p>Email：<span id="accEmail"></span></p>
    <p>方案：<span id="accPlan"></span></p>
    <ul id="orders"></ul>
  </section>
  <footer>KenEyeCue Advisor · 訊號顧問，不是算命師。</footer>
  <script src="js/mapping.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
